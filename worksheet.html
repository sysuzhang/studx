<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字帖工坊 - 汉字学习平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header no-print">
      <div class="site-nav">
        <a href="./index.html">首页</a>
        <a href="./practice.html">分级练习</a>
        <a href="./pinyin.html">拼音频道</a>
        <a href="./typing.html">打字闯关</a>
        <a href="./keyboard.html">键盘练习</a>
        <a href="./calendar.html">学习日历</a>
        <a href="./overview.html">汉字总览</a>
        <a href="./xinhua.html">新华字典</a>
        <a href="./pricing.html">订阅中心</a>
        <a href="./worksheet.html" class="active">字帖工坊</a>
        <a href="./user.html">用户中心</a>
      </div>
      <h1>汉字字帖打印工坊</h1>
      <p>支持自定义字帖生成、A4 打印、汉字笔顺动画演示与笔画顺序查看。</p>
    </header>

    <main class="layout">
      <aside class="panel controls no-print">
        <section>
          <h2>1) 输入练习文字</h2>
          <textarea id="textInput" rows="5" placeholder="请输入要练习的汉字，例如：永和春风"></textarea>
          <p class="hint">将自动过滤非汉字字符。</p>
        </section>

        <section class="no-print">
          <h2>1.5) 字帖收藏字</h2>
          <p id="cartMeta" class="hint">已收藏 0 个汉字</p>
          <div id="cartChars" class="char-picker"></div>
          <div class="actions">
            <button id="useCartBtn" type="button">使用收藏字</button>
            <button id="mergeCartBtn" type="button" class="ghost">追加到输入框</button>
            <button id="clearCartBtn" type="button" class="ghost">清空收藏</button>
          </div>
        </section>

        <section>
          <h2>2) 字帖配置</h2>
          <div class="form-grid">
            <label for="gridType">格子类型</label>
            <select id="gridType">
              <option value="tian">田字格</option>
              <option value="mi">米字格</option>
              <option value="hui">回宫格</option>
            </select>

            <label for="repeatCount">每字练习格数</label>
            <input id="repeatCount" type="number" min="2" max="24" value="10" />

            <label for="columns">每行格子数</label>
            <input id="columns" type="number" min="4" max="20" value="10" />

            <label for="cellSize">格子尺寸 (px)</label>
            <input id="cellSize" type="range" min="40" max="90" value="60" />

            <label for="traceMode">练习模式</label>
            <select id="traceMode">
              <option value="trace">描红</option>
              <option value="blank">空白临写</option>
            </select>

            <label for="showGuide">显示参考字</label>
            <input id="showGuide" type="checkbox" checked />
          </div>
        </section>

        <section class="actions">
          <button id="generateBtn" type="button">生成字帖</button>
          <button id="printBtn" type="button">打印字帖</button>
          <button id="clearBtn" type="button" class="ghost">清空</button>
        </section>
        <p id="billingTip" class="hint">
          当前套餐：基础版；打印配额：已使用 0/2 次，剩余：2 次。<a href="./pricing.html">查看订阅方案</a>
        </p>

        <section>
          <h2>3) 选择演示汉字</h2>
          <div id="charPicker" class="char-picker"></div>
        </section>
      </aside>

      <section class="content">
        <article class="panel stroke-panel no-print">
          <div class="stroke-header">
            <h2>汉字笔顺演示</h2>
            <div class="stroke-char">
              当前汉字：<strong id="currentChar">-</strong>
            </div>
          </div>

          <div class="stroke-body">
            <div id="writerTarget" class="writer-target" aria-label="笔顺演示区域"></div>
            <div class="stroke-side">
              <div class="stroke-tools">
                <button id="animateBtn" type="button">播放笔顺</button>
                <button id="loopBtn" type="button">循环演示：关</button>
                <button id="speakBtn" type="button" class="ghost">朗读汉字</button>
                <button id="followBtn" type="button" class="ghost">开始跟读</button>
                <button id="addCurrentToCartBtn" type="button" class="ghost">加入字帖收藏</button>
                <button id="quizBtn" type="button" class="ghost">手写练习</button>
              </div>
              <p id="strokeMeta" class="hint">请选择一个汉字查看笔画顺序。</p>
              <p id="followResult" class="hint">识别结果：-</p>
              <p id="followCompare" class="hint">对比结果：-</p>
              <ol id="strokeOrderList" class="stroke-order-list"></ol>
            </div>
          </div>
        </article>

        <article class="panel preview-panel">
          <div class="preview-head no-print">
            <h2>字帖预览（打印区）</h2>
            <p class="hint">打印时建议勾选“背景图形”。</p>
          </div>
          <div id="worksheetPages" class="worksheet-pages"></div>
        </article>
      </section>
    </main>

    <script src="./learning-store.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer/dist/hanzi-writer.min.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
